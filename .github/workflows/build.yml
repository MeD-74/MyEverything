name: Build OurBeam

# Builds the real installers on real Windows + macOS runners.
# Linux cannot build a Windows NSIS installer (no wine) or a signed Mac app,
# so do NOT try to build those targets locally — this workflow is the build route.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: OurBeam-Windows
          path: |
            dist/OurBeam-Setup-v*.exe
            dist/OurBeam-v*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: OurBeam-Mac
          path: |
            dist/OurBeam-v*.dmg
            dist/OurBeam-v*.zip
          if-no-files-found: error
