<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — OurBeam</title>
<style>
  @font-face { font-family: 'Cairo'; src: url('assets/fonts/Cairo.ttf') format('truetype');
    font-weight: 200 1000; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Chakra Petch'; src: url('assets/fonts/ChakraPetch-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0a0a0a; color: #f2f2f2;
    font-family: 'Chakra Petch', 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 20px; }
  .logo { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .logo-mark { width: 64px; height: 64px; border-radius: 18px; background: #fa1e4e;
    display: flex; align-items: center; justify-content: center; flex: none; }
  .logo h1 { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: 6px; color: #fff; }
  .logo h1 span { color: #fa1e4e; }
  .search { width: min(620px, 92vw); display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 6px 8px 6px 20px; margin-bottom: 44px; }
  .search svg { flex: none; color: #5f6368; }
  .search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 16px; font-family: inherit; color: #202124; height: 40px; }
  .search input::placeholder { color: #5f6368; }
  .search button { flex: none; border: none; background: #fa1e4e; color: #fff; border-radius: 999px;
    padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center;
    max-width: 760px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-decoration: none; color: #e8eaed; width: 92px; position: relative; }
  .tile-icon { width: 64px; height: 64px; border-radius: 50%; background: #1c1c1c;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 1px solid #2a2a2a; position: relative; }
  .tile:hover .tile-icon { border-color: #fa1e4e; background: #2a2a2a; }
  .tile-icon .letter { font-size: 26px; font-weight: 700; color: #fa1e4e; }
  .tile-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile-icon svg { width: 30px; height: 30px; }
  .tile-label { font-size: 13px; text-align: center; white-space: nowrap; }
  .tile .remove { position: absolute; top: -4px; right: 6px; width: 20px; height: 20px;
    border-radius: 50%; border: none; background: #7a1d1d; color: #fff; font-size: 12px;
    line-height: 1; cursor: pointer; display: none; padding: 0; }
  .tile:hover .remove { display: block; }
  .hint { margin-top: 40px; color: #9aa0a6; font-size: 13px; text-align: center; line-height: 1.8; }
  .hint b { color: #dadce0; }
</style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="#fff" d="M7 6h10a5 5 0 0 1 5 5v2a4 4 0 0 1-7.2 2.4L13 13.5h-2l-1.8 1.9A4 4 0 0 1 2 13v-2a5 5 0 0 1 5-5zm-1.5 7v1.5h2V13h-2zM9 12.5h1.5v1.5H9v-1.5zm4.5.5h2v2h-2v-2zm3-3h2v2h-2V10z"/></svg>
    </div>
    <h1>OUR<span>BEAM</span></h1>
  </div>

  <form class="search" action="https://duckduckgo.com/" method="get">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input type="text" name="q" placeholder="Search DuckDuckGo or type a URL" autocomplete="off" spellcheck="false" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="shortcuts" id="shortcuts"></div>

  <p class="hint">New tab opens here — AirConsole is one click away.<br>
  Host a room from the toolbar above and send the code to Loly, or click <b>AirConsole</b> to play.</p>

<script>
(function () {
  'use strict';
  var DEFAULTS = [
    { name: 'Top Cinema', url: 'https://topcinemaa.one', domain: 'topcinemaa.one' },
    { name: 'ShofFree', url: 'https://shoffree.cc/recent', domain: 'shoffree.cc' },
    { name: 'CimaNow', url: 'https://cimanow.cc', domain: 'cimanow.cc' },
    { name: 'Drama Cafe', url: 'https://ddramacafe-tv.mom', domain: 'ddramacafe-tv.mom' },
    { name: '3isq', url: 'https://3isq.qist3ishq.site', domain: '3isq.qist3ishq.site' },
    { name: 'YouTube', url: 'https://www.youtube.com', domain: 'youtube.com' },
    { name: 'Instagram', url: 'https://www.instagram.com', domain: 'instagram.com' }
  ];
  var CUSTOM_KEY = 'ourbeam-home-shortcuts';
  function loadCustom() {
    try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveCustom(list) {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function tileIcon(site) {
    if (site.icon === 'gamepad') {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fa1e4e" d="M7 6h10a5 5 0 0 1 5 5v2a4 4 0 0 1-7.2 2.4L13 13.5h-2l-1.8 1.9A4 4 0 0 1 2 13v-2a5 5 0 0 1 5-5zm-1.5 7v1.5h2V13h-2zM9 12.5h1.5v1.5H9v-1.5zm4.5.5h2v2h-2v-2zm3-3h2v2h-2V10z"/></svg>';
    }
    var host = site.domain || '';
    try { host = new URL(site.url).hostname; } catch (e) {}
    var letter = (site.name || '?').charAt(0).toUpperCase();
    return '<span class="letter">' + letter + '</span>' +
      '<img src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64" alt="" onerror="this.remove()">';
  }
  function render() {
    var box = document.getElementById('shortcuts');
    box.innerHTML = '';
    var all = DEFAULTS.concat(loadCustom().map(function (s) { s.custom = true; return s; }));
    all.forEach(function (site) {
      var a = document.createElement('a');
      a.className = 'tile';
      a.href = site.url;
      a.innerHTML = '<span class="tile-icon">' + tileIcon(site) + '</span>' +
        '<span class="tile-label"></span>';
      a.querySelector('.tile-label').textContent = site.name;
      if (site.custom) {
        var x = document.createElement('button');
        x.className = 'remove';
        x.textContent = '×';
        x.title = 'Remove shortcut';
        x.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var list = loadCustom().filter(function (s) { return s.url !== site.url; });
          saveCustom(list);
          render();
        });
        a.appendChild(x);
      }
      box.appendChild(a);
    });
    var add = document.createElement('a');
    add.className = 'tile';
    add.href = '#';
    add.innerHTML = '<span class="tile-icon"><span class="letter">+</span></span><span class="tile-label">Add shortcut</span>';
    add.addEventListener('click', function (e) {
      e.preventDefault();
      var name = prompt('Shortcut name (e.g. Netflix):');
      if (!name) return;
      var url = prompt('Website address (e.g. https://www.netflix.com):');
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      var list = loadCustom();
      list.push({ name: name.trim(), url: url.trim() });
      saveCustom(list);
      render();
    });
    box.appendChild(add);
  }
  render();
})();
</script>
</body>
</html>
